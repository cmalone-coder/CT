<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CT Study Viewer</title>
<style>
  :root{
    --bg: #0a0b0c;
    --panel: #131516;
    --panel-line: #232627;
    --text: #d8d9d6;
    --text-dim: #74797a;
    --amber: #ffb454;
    --amber-dim: #8a6a3a;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    height:100vh;
  }

  /* Header */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--panel-line);
    background:var(--panel);
    flex-shrink:0;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    font-family:var(--mono);
    font-size:13px;
    color:var(--amber);
    letter-spacing:0.12em;
    border:1px solid var(--amber-dim);
    padding:2px 6px;
    border-radius:2px;
  }
  .brand h1{font-size:15px; font-weight:500; color:var(--text); letter-spacing:0.01em;}
  .nav-link{
    font-family:var(--mono); font-size:11.5px; color:var(--text-dim);
    text-decoration:none; border:1px solid var(--panel-line); border-radius:3px;
    padding:5px 10px; margin-left:8px; transition:all 0.12s;
  }
  .nav-link:hover{color:var(--amber); border-color:var(--amber-dim);}
  .disclaimer{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
    max-width:420px;
    text-align:right;
    line-height:1.5;
  }

  /* Layout */
  .layout{flex:1; display:flex; min-height:0;}

  /* Sidebar */
  nav{
    width:230px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--panel-line);
    overflow-y:auto;
    padding:16px 0;
  }
  .nav-group-label{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.14em;
    text-transform:uppercase;
    padding:6px 18px;
    margin-top:10px;
  }
  .nav-group-label:first-child{margin-top:0;}
  .series-btn{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-left:2px solid transparent;
    color:var(--text-dim);
    font-family:var(--sans);
    font-size:13px;
    padding:9px 18px;
    cursor:pointer;
    transition:background 0.12s, color 0.12s, border-color 0.12s;
  }
  .series-btn:hover{background:#1a1c1d; color:var(--text);}
  .series-btn.active{
    color:var(--amber);
    border-left-color:var(--amber);
    background:#1a1815;
  }
  .series-btn .count{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-dim);
    display:block;
    margin-top:2px;
  }

  /* Viewer */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
  }
  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
      radial-gradient(ellipse at center, #141516 0%, #0a0b0c 75%);
    overflow:hidden;
    cursor:grab;
    user-select:none;
  }
  .stage.dragging{cursor:grabbing;}
  .stage img{
    max-height:92%;
    max-width:92%;
    object-fit:contain;
    filter:drop-shadow(0 0 30px rgba(0,0,0,0.6));
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .stage .hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
    letter-spacing:0.06em;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0.85;
    pointer-events:none;
  }
  .stage .hint .dot{width:4px;height:4px;background:var(--amber);border-radius:50%;}

  .frame-index{
    position:absolute;
    top:16px;
    right:20px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--amber);
    letter-spacing:0.04em;
  }
  .frame-index .of{color:var(--text-dim);}

  .series-label{
    position:absolute;
    top:16px;
    left:20px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.04em;
  }

  /* Scrub bar */
  .scrub{
    flex-shrink:0;
    padding:16px 24px 20px;
    background:var(--panel);
    border-top:1px solid var(--panel-line);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .scrub button{
    background:#1a1c1d;
    border:1px solid var(--panel-line);
    color:var(--text);
    width:30px;
    height:30px;
    border-radius:3px;
    cursor:pointer;
    font-family:var(--mono);
    font-size:13px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .scrub button:hover{border-color:var(--amber-dim); color:var(--amber);}
  input[type=range]{
    flex:1;
    -webkit-appearance:none;
    height:3px;
    background:var(--panel-line);
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--amber);
    cursor:pointer;
    box-shadow:0 0 8px rgba(255,180,84,0.5);
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--amber);
    border:none;
    cursor:pointer;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--panel-line); border-radius:4px;}

  .nav-toggle{
    display:none;
    background:#1a1c1d; border:1px solid var(--panel-line); color:var(--text);
    width:38px; height:38px; border-radius:4px; font-size:18px; cursor:pointer;
    flex-shrink:0; align-items:center; justify-content:center;
  }
  .nav-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:19; opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .nav-backdrop.open{opacity:1; pointer-events:auto;}

  @media (max-width: 820px){
    header{padding:10px 14px; flex-wrap:wrap; gap:6px;}
    .brand{gap:8px; flex-wrap:wrap;}
    .brand h1{font-size:13px;}
    .nav-toggle{display:flex;}
    .disclaimer{display:none;}
    .nav-link{font-size:10.5px; padding:4px 8px;}

    .layout{position:relative; overflow:hidden;}
    nav{
      position:fixed; left:0; right:0; bottom:0; top:auto;
      width:auto; max-height:70vh;
      border-right:none; border-top:1px solid var(--panel-line);
      border-radius:14px 14px 0 0;
      transform:translateY(100%);
      transition:transform 0.25s ease;
      z-index:20;
      padding-bottom:24px;
    }
    nav.open{transform:translateY(0);}

    main{width:100%;}
    .series-btn{padding:13px 18px; font-size:14px;}
    input[type=range]{height:6px;}
    input[type=range]::-webkit-slider-thumb{width:20px; height:20px;}
    .scrub button{width:40px; height:40px; font-size:16px;}
    .frame-index, .series-label{font-size:11px;}
    .hint{font-size:9.5px; text-align:center; padding:0 12px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <button id="navToggle" class="nav-toggle" aria-label="Toggle series list">☰</button>
    <span class="mark">CT</span>
    <h1>Maxillofacial Study — De-identified Viewer</h1>
    <a href="index.html" class="nav-link">View 3D reconstruction →</a>
  </div>
  <div class="disclaimer">
    All identifying data (name, DOB, MRN, accession #) has been stripped from every image and file.<br>
    For informational discussion only — not a diagnostic read.
  </div>
</header>

<div class="nav-backdrop" id="navBackdrop"></div>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="series-label" id="seriesLabel"></div>
    <div class="frame-index" id="frameIndex"></div>
    <div class="stage" id="stage">
      <img id="mainImg" src="" alt="CT slice">
      <div class="hint" id="hint"><span class="dot"></span><span id="hintText">Drag left / right to scrub</span></div>
    </div>
    <div class="scrub">
      <button id="prevBtn">‹</button>
      <input type="range" id="slider" min="1" max="1" value="1">
      <button id="nextBtn">›</button>
    </div>
  </main>
</div>

<script>
const manifest = [{"key": "axial_1mm_a", "label": "Axial (1.0mm)", "count": 196}, {"key": "axial_1mm_b", "label": "Axial (1.0mm) \u2014 alt window", "count": 196}, {"key": "axial_1_5mm", "label": "Axial (1.5mm)", "count": 131}, {"key": "axial_1_5mm_b", "label": "Axial (1.5mm) \u2014 alt window", "count": 131}, {"key": "coronal_a", "label": "Coronal", "count": 113}, {"key": "coronal_b", "label": "Coronal \u2014 alt window", "count": 113}, {"key": "sagittal_a", "label": "Sagittal", "count": 138}, {"key": "sagittal_b", "label": "Sagittal \u2014 alt window", "count": 138}, {"key": "recon3d_rotation_A", "label": "3D Rotation \u2014 Bone", "count": 20}, {"key": "recon3d_rotation_B", "label": "3D Rotation \u2014 Segmented", "count": 38}, {"key": "panoramic_xray", "label": "Panoramic X-ray", "count": 1}];

let current = manifest[0];
let frame = 1;

const nav = document.getElementById('nav');
const groups = {
  "Cross-sections": ["axial_1mm_a","axial_1mm_b","axial_1_5mm","axial_1_5mm_b","coronal_a","coronal_b","sagittal_a","sagittal_b"],
  "3D Renders": ["recon3d_rotation_A","recon3d_rotation_B"],
  "Dental": ["panoramic_xray"]
};

function buildNav(){
  Object.entries(groups).forEach(([groupName, keys])=>{
    const label = document.createElement('div');
    label.className = 'nav-group-label';
    label.textContent = groupName;
    nav.appendChild(label);
    keys.forEach(key=>{
      const s = manifest.find(m=>m.key===key);
      if(!s) return;
      const btn = document.createElement('button');
      btn.className = 'series-btn';
      btn.dataset.key = key;
      btn.innerHTML = s.label + '<span class="count">' + s.count + ' images</span>';
      btn.onclick = ()=> selectSeries(s);
      nav.appendChild(btn);
    });
  });
}

function selectSeries(s){
  current = s;
  frame = Math.ceil(s.count/2);
  document.querySelectorAll('.series-btn').forEach(b=>b.classList.toggle('active', b.dataset.key===s.key));
  document.getElementById('slider').max = s.count;
  document.getElementById('seriesLabel').textContent = s.label;
  document.getElementById('hintText').textContent = s.key.startsWith('recon3d') ? 'Drag to rotate' : 'Drag or scroll to scrub slices';
  render();
  if(window.innerWidth <= 820){
    document.getElementById('nav').classList.remove('open');
    document.getElementById('navBackdrop').classList.remove('open');
  }
}

function render(){
  const idx = String(frame).padStart(4,'0');
  document.getElementById('mainImg').src = `images/${current.key}/${idx}.jpg`;
  document.getElementById('slider').value = frame;
  document.getElementById('frameIndex').innerHTML = frame + '<span class="of"> / ' + current.count + '</span>';
}

function clampFrame(){
  if(frame < 1) frame = 1;
  if(frame > current.count) frame = current.count;
}

document.getElementById('slider').addEventListener('input', e=>{
  frame = parseInt(e.target.value);
  render();
});
document.getElementById('prevBtn').onclick = ()=>{ frame--; clampFrame(); render(); };
document.getElementById('nextBtn').onclick = ()=>{ frame++; clampFrame(); render(); };

// Drag-to-scrub / drag-to-rotate
const stage = document.getElementById('stage');
let dragging = false, startX = 0, startFrame = 1;

stage.addEventListener('mousedown', e=>{
  dragging = true; startX = e.clientX; startFrame = frame;
  stage.classList.add('dragging');
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx = e.clientX - startX;
  const sensitivity = current.key.startsWith('recon3d') ? 8 : 5;
  const delta = Math.round(dx / sensitivity);
  frame = startFrame - delta;
  clampFrame();
  render();
});
window.addEventListener('mouseup', ()=>{ dragging=false; stage.classList.remove('dragging'); });

// Touch support
stage.addEventListener('touchstart', e=>{
  dragging = true; startX = e.touches[0].clientX; startFrame = frame;
}, {passive:true});
stage.addEventListener('touchmove', e=>{
  if(!dragging) return;
  const dx = e.touches[0].clientX - startX;
  const sensitivity = current.key.startsWith('recon3d') ? 8 : 5;
  const delta = Math.round(dx / sensitivity);
  frame = startFrame - delta;
  clampFrame();
  render();
}, {passive:true});
stage.addEventListener('touchend', ()=>{ dragging=false; });

// Scroll wheel to scrub
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  frame += e.deltaY > 0 ? 1 : -1;
  clampFrame();
  render();
}, {passive:false});

// Keyboard
window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight'){ frame++; clampFrame(); render(); }
  if(e.key === 'ArrowLeft'){ frame--; clampFrame(); render(); }
});

buildNav();
selectSeries(manifest[0]);
document.querySelector('.series-btn').classList.add('active');

const navToggle = document.getElementById('navToggle');
const navEl = document.getElementById('nav');
const navBackdrop = document.getElementById('navBackdrop');
navToggle.onclick = ()=>{
  navEl.classList.toggle('open');
  navBackdrop.classList.toggle('open');
};
navBackdrop.onclick = ()=>{
  navEl.classList.remove('open');
  navBackdrop.classList.remove('open');
};
</script>

</body>
</html>
